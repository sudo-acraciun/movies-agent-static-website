name: Deploy to GitHub Pages

# Every push to main publishes. The site is static and has no runtime secrets,
# so there is nothing to gate behind a manual approval.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs these two; the default GITHUB_TOKEN has neither.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two publishes at once, and let a newer push supersede an in-flight
# one. cancel-in-progress is safe here precisely because the build is pure:
# a cancelled run leaves nothing half-written on the live site.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install` so the lockfile is authoritative and
      # a transitive update can never silently change what ships.
      - run: npm ci

      - run: npm run build

      # Which sitemap pages this deploy changes, read before the deploy replaces
      # the live copies. Must never block a publish, hence the two guards.
      - id: indexnow
        continue-on-error: true
        timeout-minutes: 5
        run: |
          node scripts/indexnow.mjs diff > indexnow.txt
          {
            echo 'list<<INDEXNOW_EOF'
            cat indexnow.txt
            echo 'INDEXNOW_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tells IndexNow (Bing, and the engines that share its index) which pages
  # changed. Runs only after a successful deploy, and only when one did. A run
  # cancelled by a newer push skips its submission; Bing still reads the sitemap.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - env:
          LIST: ${{ needs.build.outputs.indexnow }}
        run: printf '%s\n' "$LIST" | node scripts/indexnow.mjs submit
